<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiriusCat — інтерактивний котик</title>
    <meta name="description" content="SiriusCat — інтерактивний котик із анімаціями, звуками та голосовими командами.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/loading.css">
    <link rel="stylesheet" href="css/navbarButtons.css">
    <link rel="stylesheet" href="css/clock.css">
    <link rel="stylesheet" href="css/cat/cat.css">
    <link rel="stylesheet" href="css/cat/animations.css">
    <link rel="stylesheet" href="css/cat/brows.css">
    <link rel="stylesheet" href="css/cat/eyes.css">
    <link rel="stylesheet" href="css/cat/mouth.css">
    <link rel="stylesheet" href="css/cat/nose.css">
    <link rel="stylesheet" href="css/cat/paw.css">
    <link rel="stylesheet" href="css/cat/speech-bubble.css">
    <link rel="stylesheet" href="css/cat/whiskers.css">
    <link rel="stylesheet" href="css/cat/skin_cats.css">
</head>
<body>
    <nav>
            <button id="closeAdm" class="action-button" aria-controls="admin-panel" aria-expanded="true">ADM</button>
            <button id="home-control-button" class="action-button" disabled title="Функція ще не реалізована">Керування домом 🏠 (скоро)</button>
    </nav>
    
    
    <div class="cat-container" id="cat-container" role="button" tabindex="0" aria-label="Погладити Сіріуса">
        
        <div class="ears-container">
            <div class="ear left"></div>
            <div class="ear right"></div>
        </div>
        
        <div class="cat">
            
            <div class="whiskers">
                <div class="left"></div>
                <div class="left"></div>
                <div class="left"></div>
                <div class="right"></div>
                <div class="right"></div>
                <div class="right"></div>
            </div>
            
            <div class="brows">
                <div class="left"></div>
                <div class="right"></div>
            </div>
            
            <div class="eye left">
                <div class="pupil"></div>
            </div>
            <div class="eye right">
                <div class="pupil"></div>
            </div>
            
            <div class="nose"></div>
            
            <div class="mouth">
                <div class="tongue"></div>
            </div>
        </div>

        
        <div class="paw" id="paw" style="display: none;">
            <div class="toe toe-1"></div>
            <div class="toe toe-2"></div>
            <div class="toe toe-3"></div>
            <div class="pad"></div>
        </div>
        
        <div class="speech-bubble" role="status" aria-live="polite">Мяу!</div>
    </div>

    
    <div class="all-buttons-container" id="admin-panel">
        <h1>Адмін панель</h1>
        <span id="site-version" class="version-label"></span>
        
        <div class="buttons-container">
            
            <label for="scaleSlider">Змінити масштаб кота:</label>
            <input 
            type="range" 
            id="scaleSlider" 
            min="0.5" 
            max="2" 
            step="0.1" 
            value="1"
            />
            

                <button id="theme-icon" class="action-button">Змінити тему</button>

            
            <button id="talk-button" class="action-button">Розмовляти</button>
            <button id="animation-button" class="action-button">Анімація</button>
            <button id="say-something-button" class="action-button">Сказати що небудь</button>
            <button id="showPawButton" class="action-button">Помахати лапкою</button>
            <button id="voice-button" class="action-button" aria-pressed="false">🎙 Голосові команди</button>
            <button id="toggle-navbar-button" class="action-button">Прибрати Navbar</button>
            <button id="playButton-1" class="action-button">Помурчи 😺</button>
            <button id="playButton" class="action-button">Мяукни 😺</button>
            <button id="playNotification" class="action-button">Відтворити Сповіщення 🎶</button>
            <button id="playNotification-1" class="action-button">Відтворити Сповіщення 1 🎶</button>
            <button id="playNotification-2" class="action-button">Відтворити Сповіщення 2 🎶</button>
            <button id="playNotification-3" class="action-button">Відтворити Сповіщення 3 🎶</button>
            <audio id="sound" src="sounds/meow_1.mp3"></audio>
            <audio id="sound-1" src="sounds/purring_cat_1.mp3"></audio>
            <audio id="Notification" src="sounds/notification_1.mp3"></audio>
            <audio id="Notification-1" src="sounds/notification_2.mp3"></audio>
            <audio id="Notification-2" src="sounds/notification_3.mp3"></audio>
            <audio id="Notification-3" src="sounds/notification_4.mp3"></audio>
        </div>
        <p id="voice-status" aria-live="polite">Скажи: «привіт», «мяу», «помахай лапкою» або «зміни тему».</p>
    </div>
    <footer id="footer">
        
        <div id="clock"></div>
    </footer>
    <script src="js/script.js"></script>
    
    <script src="js/catPhrases.js"></script>
    <script src="js/changeTheme.js"></script>
    <script src="js/ToggleNavbar.js"></script>
    <script src="js/playSound.js"></script>
    <script src="js/scaleSlider.js"></script>
    <script src="js/version.js"></script>
    <script src="js/toggleAdminPanel.js"></script>
    <script src="js/seeClock.js"></script>
    <script src="js/voiceCommands.js"></script>
</body>
</html>
